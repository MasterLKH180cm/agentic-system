name: Agentic System CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_ENV: test
      AGENT_MODEL_PROVIDER: offline
      AGENT_RAG_API_KEY: local-development-key
      AGENT_RAG_URL: http://127.0.0.1:8000
      RAGS_ENV: test
      RAGS_API_KEY: local-development-key
    steps:
      - uses: actions/checkout@v4
      - name: Checkout RAGs dependency
        uses: actions/checkout@v4
        with:
          repository: MasterLKH180cm/RAGs
          ref: 76ac10b63dac8b3ecc4cd099222f6ee6cc489877 # tested RAGs master squash commit
          path: external/RAGs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install both services
        run: |
          python -m pip install -e ".[dev,mcp]"
          python -m pip install -e ./external/RAGs
      - name: Static analysis
        run: ruff check agentic tests --select E4,E7,E9,F
      - name: Integration tests
        run: pytest -q
      - name: Real two-service end-to-end smoke test
        shell: bash
        run: |
          uvicorn rags.api:app --host 127.0.0.1 --port 8000 &
          rag_pid=$!
          uvicorn agentic.api:app --host 127.0.0.1 --port 8001 &
          api_pid=$!
          python -m agentic.worker &
          worker_pid=$!
          trap "kill $rag_pid $api_pid $worker_pid || true" EXIT
          python - <<'PY'
          import time
          import httpx

          with httpx.Client(timeout=8) as c:
              for i in range(50):
                  try:
                      assert c.get("http://127.0.0.1:8000/live").status_code == 200
                      assert c.get("http://127.0.0.1:8001/live").status_code == 200
                      break
                  except Exception:
                      time.sleep(0.2)
              else:
                  raise AssertionError("Both services failed to start")
              a = {"Authorization": "Bearer local-development-key"}
              b = {"Authorization": "Bearer local-agent-key"}
              doc = c.post("http://127.0.0.1:8000/documents", headers=a,
                  json={"title": "Test session policy", "text":
                        "# Session\nSession timeout is 30 minutes after inactivity."})
              assert doc.status_code == 201, doc.text
              run = c.post("http://127.0.0.1:8001/workflows", headers=b,
                           json={"goal": "What is the session timeout?"})
              assert run.status_code == 202, run.text
              rid = run.json()["id"]
              for i in range(100):
                  state = c.get("http://127.0.0.1:8001/workflows/" + rid, headers=b).json()
                  if state["status"] in ("completed", "failed"):
                      break
                  time.sleep(0.2)
              assert state["status"] == "completed", state
              assert len(state["steps"]) == 2
              assert state["steps"][0]["result"]["citations"], state
              assert "30 minutes" in state["steps"][1]["result"]["answer"], state
              print("PASS: real RAGs -> API -> leased worker -> synthesis")
          PY
          python tests/smoke_mcp.py


  docker-compose:
    name: Docker Compose full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested RAGs code
        uses: actions/checkout@v4
        with:
          repository: MasterLKH180cm/RAGs
          ref: 76ac10b63dac8b3ecc4cd099222f6ee6cc489877
          path: external/RAGs
      - name: Put the sibling RAGs build context in place
        run: |
          mkdir -p ../RAGs
          cp -a external/RAGs/. ../RAGs/
      - name: Build and run all three containers
        run: docker compose up -d --build --wait
      - name: Exercise the full stack from outside containers
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          def request(path, token=None, data=None):
              headers = {}
              if token:
                  headers["Authorization"] = "Bearer " + token
              if data is not None:
                  headers["Content-Type"] = "application/json"
              body = None if data is None else json.dumps(data).encode()
              method = "POST" if data is not None else "GET"
              req = urllib.request.Request(
                  "http://127.0.0.1:" + path, data=body,
                  headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=8) as response:
                  return json.loads(response.read())

          assert request("8000/live")["status"] == "ok"
          assert request("8001/live")["status"] == "ok"
          doc = request("8000/documents", "local-development-key", {
              "document_id": "docker-verification",
              "title": "Docker verification",
              "text": "# Session\nSession expires after 45 minutes of inactivity.",
          })
          assert doc["chunks"] >= 1, doc
          run = request("8001/workflows", "local-agent-key", {
              "goal": "When does the session expire in the Docker verification document?"
          })
          for _ in range(90):
              state = request("8001/workflows/" + run["id"], "local-agent-key")
              if state["status"] in {"completed", "failed"}:
                  break
              time.sleep(0.5)
          assert state["status"] == "completed", state
          assert state["steps"][0]["result"]["citations"], state
          assert "45 minutes" in state["steps"][-1]["result"]["answer"], state
          print("PASS: real containers: RAGs + Agentic API + Worker")
          PY
      - name: Capture container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Clean up the stack
        if: always()
        run: docker compose down -v --remove-orphans
