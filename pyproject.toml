[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-system-platform"
version = "0.1.0"
description = "Durable workflow engine and bounded agent tools for RAGs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.19,<2"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pytest-asyncio>=0.23,<2"]

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
