[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-system-platform"
version = "0.5.0"
description = "Durable workflow engine and bounded agent tools for RAGs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.19,<2"]
postgres = ["psycopg[binary,pool]>=3.2,<4", "psycopg-pool>=3.2,<4"]
storage = ["boto3>=1.35,<2", "redis>=5,<7"]
telemetry = ["opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp-proto-http>=1.28,<2"]
dev = ["pytest-cov>=7.1,<8", "pytest>=8,<10", "ruff>=0.8,<1", "pytest-asyncio>=0.23,<2"]

e2e = ["playwright==1.62.0"]

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
junit_family = "xunit2"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.coverage.run]
branch = true
source = ["agentic"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.testing.coverage]
baseline = "docs/testing-baseline.json"
package = "agentic"
minimum_lines = 85
minimum_branches = 75
